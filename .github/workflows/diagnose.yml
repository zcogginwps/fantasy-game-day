name: ESPN Diagnose

# Temporary, manual only. Prints what ESPN returns for one league so the
# per-week scoring can be verified from a machine that can actually reach it.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_IDS: ${{ secrets.ESPN_LEAGUE_IDS }}
        run: python espn_diagnose.py
