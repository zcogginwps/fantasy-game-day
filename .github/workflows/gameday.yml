name: Game Day

on:
  # Actions cron is UTC and cannot follow daylight saving, and kickoff times
  # move around anyway - so run often and let notify_run.py decide whether
  # anything is actually worth sending.
  schedule:
    # Baseline: often enough to catch morning alerts and lineup moves.
    - cron: "*/30 12-23,0-6 * * *"
    # Denser while games are actually being played, so live scores move.
    # Times are UTC: these cover the Sunday slate and the Thursday, Sunday
    # and Monday night games in US Central. GitHub can delay scheduled runs
    # under load, so treat these as a target rather than a guarantee.
    - cron: "*/10 17-23 * * 0"
    - cron: "*/10 0-4 * * 1"
    - cron: "*/10 0-4 * * 2"
    - cron: "*/10 0-4 * * 5"
  # Deploy code changes straight away rather than waiting for the next tick.
  # The job's own state commits say [skip ci], so this does not loop.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Send an alert immediately (for testing)"
        required: false
        type: choice
        options: ["", "morning", "kickoff"]
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs collect and push at the same time.
concurrency:
  group: gameday
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install push library
        run: pip install -r requirements.txt

      - name: Collect and send
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_IDS: ${{ secrets.ESPN_LEAGUE_IDS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Chicago' }}
          INCLUDE_MY_BENCH: ${{ vars.INCLUDE_MY_BENCH || 'true' }}
          INCLUDE_OPPONENT_BENCH: ${{ vars.INCLUDE_OPPONENT_BENCH || 'false' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:noreply@example.com' }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
          MORNING_HOUR: ${{ vars.MORNING_HOUR || '9' }}
          KICKOFF_LEAD_MINUTES: ${{ vars.KICKOFF_LEAD_MINUTES || '120' }}
        run: |
          python notify_run.py ${{ inputs.force && format('--force {0}', inputs.force) || '' }}

      # Bookkeeping only. It must never block publishing, so the whole step is
      # allowed to fail without failing the job.
      - name: Remember collected weeks, lineups and sent alerts
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These files are generated, so merging two versions of them is
          # meaningless - rebasing produced conflicts that failed the run. Take
          # whatever is on the branch as the base and let this run's freshly
          # generated files win outright.
          for attempt in 1 2 3; do
            snapshot=$(mktemp -d)
            cp -R data "$snapshot/"

            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            rm -rf data
            cp -R "$snapshot/data" data
            rm -rf "$snapshot"

            # data/ is gitignored for local use; -f tracks just the state that
            # has to survive between scheduled runs.
            git add -f data/weeks data/lineups data/alerts 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No state changes to record."
              break
            fi

            git commit -q -m "Record weeks, lineups and sent alerts [skip ci]"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Recorded state (attempt $attempt)."
              break
            fi
            echo "Someone else pushed first; retrying ($attempt)."
          done

      - name: Assemble the site
        run: |
          mkdir -p _site/api
          cp -R web/. _site/
          cp data/report.json _site/api/report.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
