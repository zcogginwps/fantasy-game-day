<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="helmet.png">
<script src="vapid-public-key.js"></script>
<title>Fantasy Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1e222b;
    --line: #2a2f3a;
    --text: #e8ebf0;
    --muted: #939bab;
    --for: #34d17c;
    --for-dim: rgba(52, 209, 124, .13);
    --against: #ff5f6d;
    --against-dim: rgba(255, 95, 109, .13);
    --both: #ffc531;
    --both-dim: rgba(255, 197, 49, .13);
    --warn: #ffb020;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --surface: #fff; --surface-2: #f0f2f6; --line: #e0e4ea;
      --text: #12151b; --muted: #5f6877;
      --for: #0f9d58; --for-dim: rgba(15,157,88,.11);
      --against: #d92d3c; --against-dim: rgba(217,45,60,.11);
      --both: #b8860b; --both-dim: rgba(212,160,23,.15);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Author rules like ".reset { display: block }" outrank the browser's own
     [hidden] styling, so anything hidden from script needs this to stay hidden. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(env(safe-area-inset-top), 12px) 12px calc(env(safe-area-inset-bottom) + 32px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  header { padding: 6px 4px 10px; }
  h1 { font-size: 21px; margin: 0 0 2px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; }

  .tabs {
    display: flex; gap: 4px; margin: 10px 0 12px; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  }
  .tab {
    flex: 1; font: inherit; font-size: 14px; font-weight: 650; padding: 8px;
    background: transparent; color: var(--muted); border: 0; border-radius: 8px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); }

  .board-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 9px;
  }
  .board-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .board-league { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .board-platform {
    margin-left: auto; font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 5px;
  }
  .board-teams {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: start; gap: 8px; margin: 4px 0 2px;
  }
  .team { min-width: 0; }
  .team.right { text-align: right; }
  .tname {
    font-size: 12.5px; font-weight: 650; overflow-wrap: anywhere; line-height: 1.3;
  }
  .team.mine .tname { color: var(--for); }
  .tscore {
    font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .tproj { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vs {
    font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .08em;
    align-self: center; padding: 0 2px;
  }

  .winbar {
    height: 6px; border-radius: 3px; background: var(--against);
    margin: 9px 0 5px; overflow: hidden;
  }
  .winbar span { display: block; height: 100%; background: var(--for); }
  .winline {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
  }
  .winline b { color: var(--text); font-size: 12.5px; }
  .winline.upcoming { margin-top: 9px; font-style: italic; }
  .est {
    font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    color: var(--both); background: var(--both-dim); padding: 1px 5px; border-radius: 4px;
  }

  .board-toggle {
    width: 100%; margin-top: 9px; font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px; background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }

  .lineups { margin-top: 10px; }
  .lu-head {
    display: grid; grid-template-columns: 1fr 34px 1fr; gap: 6px;
    font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); padding: 0 4px 5px; border-bottom: 1px solid var(--line);
  }
  .lu-head .r { text-align: right; }
  .lu-head .l { color: var(--for); }
  .lu-row {
    display: grid; grid-template-columns: 1fr 34px 1fr; gap: 6px;
    align-items: center; padding: 5px 4px; border-radius: 6px;
  }
  .lu-row:nth-child(even) { background: var(--surface-2); }
  .lu-side { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .lu-side.right { flex-direction: row-reverse; }
  .lu-txt { min-width: 0; flex: 1; }
  .lu-side.right .lu-txt { text-align: right; }
  .lu-name {
    font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere;
  }
  .lu-meta { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .lu-meta .hurt { color: var(--against); font-weight: 700; }
  .lu-pts {
    font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .lu-pts.pending { color: var(--muted); font-weight: 600; }
  .lu-slot {
    font-size: 9.5px; font-weight: 800; color: var(--muted); text-align: center;
    background: var(--line); border-radius: 4px; padding: 2px 0;
  }
  .lu-empty { color: var(--muted); font-size: 12px; }

  .board-note { color: var(--muted); font-size: 11.5px; margin: 14px 4px 0; line-height: 1.5; }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  }
  .chip.for { color: var(--for); border-color: var(--for); background: var(--for-dim); }
  .chip.against { color: var(--against); border-color: var(--against); background: var(--against-dim); }
  .chip.both { color: var(--both); border-color: var(--both); background: var(--both-dim); }

  .filters {
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
    margin: 12px 0 6px;
  }
  @media (min-width: 620px) { .filters { grid-template-columns: repeat(3, 1fr); } }
  .field { min-width: 0; }
  .field label {
    display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 3px 2px;
  }
  .field select, #search {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; -webkit-appearance: none;
    appearance: none; background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    padding-right: 26px;
  }
  .field select.active { border-color: var(--text); }
  #search {
    background-image: none; padding-right: 10px; margin-bottom: 4px;
    -webkit-appearance: none;
  }
  .reset {
    display: block; width: 100%; margin: 2px 0 4px; padding: 7px;
    font: inherit; font-size: 12.5px; font-weight: 600;
    background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  }

  .group-head {
    font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    margin: 18px 4px 8px; display: flex; align-items: center; gap: 8px;
  }
  .group-head::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .group-head.for { color: var(--for); }
  .group-head.both { color: var(--both); }
  .group-head.against { color: var(--against); }
  .wave-head {
    font-size: 13.5px; font-weight: 750; letter-spacing: -.01em; color: var(--text);
    margin: 20px 4px 2px; padding: 7px 10px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .wave-head span { color: var(--muted); font-weight: 600; }
  .day-head {
    font-size: 14px; font-weight: 750; letter-spacing: -.01em; color: var(--text);
    margin: 22px 4px 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 12px;
    padding: 9px 11px; margin-bottom: 7px;
  }
  .card.for { border-left-color: var(--for); background: linear-gradient(90deg, var(--for-dim), transparent 55%), var(--surface); }
  .card.against { border-left-color: var(--against); background: linear-gradient(90deg, var(--against-dim), transparent 55%), var(--surface); }
  .card.both { border-left-color: var(--both); background: linear-gradient(90deg, var(--both-dim), transparent 55%), var(--surface); }

  /* Standard / condensed switch for the Players tab. */
  .view-toggle {
    display: flex; gap: 4px; margin: 0 0 10px; padding: 3px; width: max-content;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
  }
  .view-toggle button {
    font: inherit; font-size: 12.5px; font-weight: 650; padding: 5px 12px;
    background: transparent; color: var(--muted); border: 0; border-radius: 7px;
    cursor: pointer;
  }
  .view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); }

  /* Condensed: one line per player, colour kept, score on the right. */
  .row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
    padding: 6px 10px; margin-bottom: 4px; font-size: 14px;
  }
  .row.for { border-left-color: var(--for); background: linear-gradient(90deg, var(--for-dim), transparent 45%), var(--surface); }
  .row.against { border-left-color: var(--against); background: linear-gradient(90deg, var(--against-dim), transparent 45%), var(--surface); }
  .row.both { border-left-color: var(--both); background: linear-gradient(90deg, var(--both-dim), transparent 45%), var(--surface); }
  .row .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { flex: 1; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row .score { margin-left: auto; font-variant-numeric: tabular-nums; }
  .row .score.pending { color: var(--muted); font-weight: 500; }

  .top { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .06em;
    padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  }
  .flag.for { color: var(--for); background: var(--for-dim); }
  .flag.against { color: var(--against); background: var(--against-dim); }
  .flag.both { color: var(--both); background: var(--both-dim); }

  .line2 { display: flex; align-items: center; gap: 7px; margin-top: 3px; flex-wrap: wrap; }
  .kick { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .score {
    margin-left: auto; font-size: 13.5px; font-weight: 750;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
    color: var(--text); white-space: nowrap;
  }
  .score.live::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--for); margin-right: 5px;
    vertical-align: middle; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .inj {
    font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
    background: rgba(255,176,32,.16); color: var(--warn);
  }
  .inj.bad { background: var(--against-dim); color: var(--against); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .col { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .col h4 {
    margin: 0 0 3px; font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .col.for h4 { color: var(--for); }
  .col.against h4 { color: var(--against); }
  .col.empty { opacity: .35; }
  .entry { font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
  .entry .lg { font-weight: 600; }
  .entry .slot {
    font-size: 10.5px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
    background: var(--line); color: var(--text); margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .entry.bench { opacity: .5; }
  .entry .vs { color: var(--muted); font-size: 11.5px; }

  .changes {
    background: var(--surface); border: 1px solid var(--both);
    border-left: 4px solid var(--both); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .changes h3 {
    margin: 0 0 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--both);
  }
  .changes div { font-size: 12.5px; line-height: 1.5; }
  .changes .mine { opacity: .65; }

  .empty-state { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }
  .err {
    background: var(--against-dim); border: 1px solid var(--against); color: var(--against);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px;
  }
  footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 26px; }

  .notif {
    margin-top: 26px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 13px;
  }
  .notif h3 {
    margin: 0 0 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .notif p { margin: 0 0 9px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .notif p.ok { color: var(--for); }
  .notif p.bad { color: var(--against); }
  .notif button {
    width: 100%; font: inherit; font-size: 14px; font-weight: 650; padding: 10px;
    background: var(--for); color: #06210f; border: 0; border-radius: 9px;
    cursor: pointer;
  }
  .notif button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .notif textarea {
    width: 100%; height: 92px; margin-top: 9px; font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px; padding: 8px; border-radius: 8px; resize: vertical;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  }
  .notif ol { margin: 9px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Loading…</h1>
    <div class="sub" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tab-players" role="tab" type="button">Players</button>
    <button class="tab" id="tab-scoreboard" role="tab" type="button">Scoreboard</button>
  </nav>

  <div class="view-toggle players-only" role="group" aria-label="View">
    <button type="button" id="view-standard" aria-pressed="true">Standard</button>
    <button type="button" id="view-condensed" aria-pressed="false">Condensed</button>
  </div>

  <input id="search" type="search" placeholder="Search player, team or league" autocomplete="off">

  <div class="filters">
    <div class="field"><label for="f-week">Week</label><select id="f-week"></select></div>
    <div class="field players-only"><label for="f-day">Day</label><select id="f-day"></select></div>
    <div class="field players-only"><label for="f-league">League</label><select id="f-league"></select></div>
    <div class="field players-only"><label for="f-side">For / Against</label><select id="f-side">
      <option value="all">All players</option>
      <option value="for">For me</option>
      <option value="against">Against me</option>
      <option value="both">Conflict</option>
    </select></div>
    <div class="field players-only"><label for="f-slot">Roster spot</label><select id="f-slot">
      <option value="all">Starters &amp; bench</option>
      <option value="starters">Starters only</option>
      <option value="bench">Bench only</option>
    </select></div>
    <div class="field players-only"><label for="f-injury">Injury</label><select id="f-injury">
      <option value="all">Any status</option>
      <option value="injured">Injured (any)</option>
      <option value="out">Out or doubtful</option>
      <option value="healthy">Healthy only</option>
    </select></div>
  </div>
  <button class="reset" id="reset" type="button">Reset filters</button>

  <div id="changes"></div>
  <div id="errors"></div>
  <main id="list"></main>
  <main id="board" hidden></main>
  <footer id="footer"></footer>

  <section class="notif" id="notif">
    <h3>Notifications</h3>
    <p id="notif-status">Checking…</p>
    <button id="notif-enable" type="button" hidden>Enable notifications</button>
    <div id="notif-result" hidden>
      <ol>
        <li>Copy the text below.</li>
        <li>On a computer, open your repository on github.com.</li>
        <li>Settings &rarr; Secrets and variables &rarr; Actions.</li>
        <li>Edit <strong>PUSH_SUBSCRIPTION</strong> and paste it in.</li>
      </ol>
      <textarea id="notif-json" readonly spellcheck="false"></textarea>
      <button class="secondary" id="notif-copy" type="button">Copy to clipboard</button>
    </div>
    <button class="secondary" id="notif-reveal" type="button" hidden>Show device code</button>
  </section>
</div>

<script>
const BAD_INJURIES = ["Out", "IR", "Doubtful", "Suspended"];
const VERDICT_LABEL = { for: "FOR ME", against: "AGAINST", both: "CONFLICT" };
// Green first, conflicts in the middle, opponents last - always.
const VERDICT_RANK = { for: 0, both: 1, against: 2 };
const GROUP_LABEL = { for: "For me", both: "Conflict", against: "Against me" };

let BUNDLE = null;

function scoreLabel(entries) {
  const values = [];
  entries.forEach(e => {
    if (e.points === null || e.points === undefined) return;
    const v = Math.round(Number(e.points) * 10) / 10;
    if (values.indexOf(v) === -1) values.push(v);
  });
  values.sort((a, b) => a - b);
  return values.map(v => v.toFixed(1)).join(" / ");
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const el = id => document.getElementById(id);
const controls = ["f-week", "f-day", "f-league", "f-side", "f-slot", "f-injury"];

function weekReport() {
  return (BUNDLE.weeks || {})[el("f-week").value] || { days: [] };
}

/* ---- filtering -------------------------------------------------------- */

function entryMatches(entry) {
  const league = el("f-league").value;
  const slot = el("f-slot").value;
  if (league !== "all" && entry.league !== league) return false;
  if (slot === "starters" && !entry.starting) return false;
  if (slot === "bench" && entry.starting) return false;
  return true;
}

function injuryMatches(player) {
  const mode = el("f-injury").value;
  const status = player.injury_status || "";
  if (mode === "injured") return status !== "";
  if (mode === "out") return BAD_INJURIES.indexOf(status) !== -1;
  if (mode === "healthy") return status === "";
  return true;
}

function searchMatches(player) {
  const term = el("search").value.trim().toLowerCase();
  if (!term) return true;
  const hay = [player.name, player.team, player.position]
    .concat(player.for_me.map(e => e.league))
    .concat(player.against_me.map(e => e.league))
    .concat(player.against_me.map(e => e.opponent))
    .join(" ").toLowerCase();
  return hay.indexOf(term) !== -1;
}

/* Narrow a player to the entries that survive the league and slot filters,
   then re-derive their colour from what is left. Filtering to one league
   should recolour a player by that league alone. */
function applyFilters(player) {
  const forMe = player.for_me.filter(entryMatches);
  const against = player.against_me.filter(entryMatches);
  if (!forMe.length && !against.length) return null;

  const verdict = forMe.length && against.length ? "both"
                : forMe.length ? "for" : "against";

  if (el("f-side").value !== "all" && el("f-side").value !== verdict) return null;
  if (!injuryMatches(player) || !searchMatches(player)) return null;

  // Before kickoff every score is 0.0 - not information, so it must not sort.
  const started = player.game_state && player.game_state !== "pre";
  const pointValues = forMe.concat(against)
    .map(e => e.points).filter(v => v !== null && v !== undefined).map(Number);
  const pointsMax = started && pointValues.length ? Math.max(...pointValues) : null;

  return Object.assign({}, player, {
    for_me: forMe, against_me: against, verdict: verdict,
    // Recomputed from the surviving leagues, so filtering to one league shows
    // that league's score rather than every league's.
    score_label: scoreLabel(forMe.concat(against)),
    points_max: pointsMax,
  });
}

function visibleDays() {
  const days = weekReport().days || [];
  const chosen = el("f-day").value;
  return chosen === "all" ? days : days.filter(d => d.date === chosen);
}

/* ---- rendering -------------------------------------------------------- */

function entryHtml(entry, isOpponent) {
  const bench = entry.starting ? "" : " bench";
  const vs = isOpponent && entry.opponent
    ? ` <span class="vs">· ${esc(entry.opponent)}</span>` : "";
  return `<div class="entry${bench}"><span class="lg">${esc(entry.league)}</span>` +
         `<span class="slot">${esc(entry.slot)}</span>${vs}</div>`;
}

function cardHtml(p) {
  // Before kickoff every score is 0.0, which is noise rather than information.
  const started = p.game_state && p.game_state !== "pre";
  const score = started && p.score_label
    ? `<span class="score${p.game_state === "in" ? " live" : ""}">` +
      `${esc(p.score_label)}</span>`
    : "";

  const injBad = BAD_INJURIES.indexOf(p.injury_status) !== -1;
  const inj = p.injury_status
    ? `<span class="inj${injBad ? " bad" : ""}">${esc(p.injury_status)}` +
      `${p.injury_body_part ? " · " + esc(p.injury_body_part) : ""}</span>`
    : "";

  const col = (entries, kind, heading, isOpponent) => entries.length
    ? `<div class="col ${kind}"><h4>${heading}</h4>` +
      entries.map(e => entryHtml(e, isOpponent)).join("") + `</div>`
    : `<div class="col ${kind} empty"><h4>${heading}</h4><div class="entry">—</div></div>`;

  return `<article class="card ${p.verdict}">
    <div class="top">
      <span class="name">${esc(p.name)}</span>
      <span class="meta">${esc(p.position)} · ${esc(p.team)}</span>
      <span class="flag ${p.verdict}">${VERDICT_LABEL[p.verdict]}</span>
    </div>
    <div class="line2">
      <span class="kick">${esc(p.kickoff_label)} · ${esc(p.matchup)}</span>
      ${inj}
      ${score}
    </div>
    <div class="cols">
      ${col(p.for_me, "for", "For me", false)}
      ${col(p.against_me, "against", "Against me", true)}
    </div>
  </article>`;
}

function rowHtml(p) {
  const started = p.game_state && p.game_state !== "pre";
  const score = started && p.score_label
    ? `<span class="score${p.game_state === "in" ? " live" : ""}">${esc(p.score_label)}</span>`
    : `<span class="score pending">${esc(p.kickoff_label)}</span>`;
  const injBad = BAD_INJURIES.indexOf(p.injury_status) !== -1;
  const inj = p.injury_status
    ? ` · <span class="inj${injBad ? " bad" : ""}">${esc(p.injury_status)}</span>` : "";
  return `<div class="row ${p.verdict}">
    <span class="name">${esc(p.name)}</span>
    <span class="meta">${esc(p.position)} · ${esc(p.team)}${inj}</span>
    ${score}
  </div>`;
}

/* ---- view toggle ------------------------------------------------------ */

let viewMode = "standard";
try { viewMode = localStorage.getItem("view") === "condensed" ? "condensed" : "standard"; }
catch (err) { /* private mode */ }

function setView(mode) {
  viewMode = mode;
  try { localStorage.setItem("view", mode); } catch (err) { /* private mode */ }
  el("view-standard").setAttribute("aria-pressed", String(mode === "standard"));
  el("view-condensed").setAttribute("aria-pressed", String(mode === "condensed"));
  render();
}
el("view-standard").addEventListener("click", () => setView("standard"));
el("view-condensed").addEventListener("click", () => setView("condensed"));
el("view-standard").setAttribute("aria-pressed", String(viewMode === "standard"));
el("view-condensed").setAttribute("aria-pressed", String(viewMode === "condensed"));

/* ---- scoreboard ------------------------------------------------------- */

// Which league cards are expanded, kept across refreshes so a two-minute
// re-fetch does not collapse what you opened.
const expanded = new Set();

// The centre column is narrow on a phone; long slot names have to shrink.
const SLOT_SHORT = {
  SUPER_FLEX: "SFLX", REC_FLEX: "RFLX", IDP_FLEX: "IDP",
  "WR/TE": "W/T", "RB/WR": "R/W",
};
const shortSlot = slot => SLOT_SHORT[slot] || String(slot || "").replace(/_/g, " ");

function ptsHtml(player) {
  // A null score means there is no figure for this week, which is not the same
  // as a zero and must not be drawn as one.
  if (!player || player.points === null || player.points === undefined) {
    return `<span class="lu-pts pending">—</span>`;
  }
  const played = player.game_state && player.game_state !== "pre";
  return `<span class="lu-pts${played ? "" : " pending"}">` +
         `${Number(player.points).toFixed(1)}</span>`;
}

function sideHtml(player, right) {
  if (!player || !player.name || player.name === "Empty") {
    return `<div class="lu-side${right ? " right" : ""}">
      <div class="lu-txt"><div class="lu-empty">—</div></div></div>`;
  }
  const bits = [player.position, player.team].filter(Boolean).join(" · ");
  const when = player.game_state && player.game_state !== "pre"
    ? player.matchup : player.kickoff_label;
  const hurt = player.injury_status
    ? ` <span class="hurt">${esc(player.injury_status)}</span>` : "";

  return `<div class="lu-side${right ? " right" : ""}">
    <div class="lu-txt">
      <div class="lu-name">${esc(player.name)}</div>
      <div class="lu-meta">${esc(bits)}${when ? " · " + esc(when) : ""}${hurt}</div>
    </div>
    ${ptsHtml(player)}
  </div>`;
}

/* Both teams in a league fill the same slot template, so pairing by position
   lines the lineups up the way the league itself displays them. */
function lineupRowsHtml(entry) {
  const mine = entry.me.starters || [];
  const theirs = entry.opponent.starters || [];
  const rows = [];
  for (let i = 0; i < Math.max(mine.length, theirs.length); i++) {
    const a = mine[i], b = theirs[i];
    const slot = (a && a.slot) || (b && b.slot) || "";
    rows.push(`<div class="lu-row">
      ${sideHtml(a, false)}
      <div class="lu-slot">${esc(shortSlot(slot))}</div>
      ${sideHtml(b, true)}
    </div>`);
  }
  return `<div class="lu-head">
      <span class="l">${esc(entry.me.name)}</span>
      <span></span>
      <span class="r">${esc(entry.opponent.name)}</span>
    </div>${rows.join("")}`;
}

function boardCardHtml(entry) {
  const open = expanded.has(entry.league);
  // A future week has no scores and no honest probability - just the fixture.
  const upcoming = entry.week_state === "upcoming";
  const estimated = entry.win_probability_source === "estimated";
  const pct = upcoming ? null : Math.round(entry.win_probability * 100);

  const team = (side, mine) => `<div class="team${mine ? " mine" : " right"}">
      <div class="tname">${esc(side.name)}</div>
      <div class="tscore">${side.points === null ? "—" : side.points.toFixed(1)}</div>
      ${side.projected === null ? "" : `<div class="tproj">proj ${side.projected}</div>`}
    </div>`;

  const odds = upcoming
    ? `<div class="winline upcoming">Not played yet</div>`
    : `<div class="winbar"><span style="width:${pct}%"></span></div>
       <div class="winline">
         <b>${pct}%</b> to win
         ${estimated ? '<span class="est">estimated</span>' : ""}
         <span style="margin-left:auto">${entry.starters_played}/${entry.starters_total} started</span>
       </div>`;

  return `<article class="board-card" data-league="${esc(entry.league)}">
    <div class="board-top">
      <span class="board-league">${esc(entry.league)}</span>
      <span class="board-platform">${esc(entry.platform)}</span>
    </div>
    <div class="board-teams">
      ${team(entry.me, true)}
      <span class="vs">VS</span>
      ${team(entry.opponent, false)}
    </div>
    ${odds}
    <button class="board-toggle" type="button">
      ${open ? "Hide lineups" : "Show lineups"}
    </button>
    <div class="lineups" ${open ? "" : "hidden"}>${lineupRowsHtml(entry)}</div>
  </article>`;
}

function renderScoreboard() {
  const board = weekReport().scoreboard || [];
  const week = el("f-week").value;

  el("subtitle").textContent =
    `Week ${week} · ${board.length} matchup${board.length === 1 ? "" : "s"}`;
  el("chips").innerHTML = "";

  if (!board.length) {
    el("board").innerHTML =
      `<div class="empty-state"><div class="big">🏈</div>
       <div>No matchups found for this week.</div></div>`;
    return;
  }

  const anyEstimated = board.some(e => e.win_probability_source === "estimated");
  const anyUpcoming = board.some(e => e.week_state === "upcoming");
  el("board").innerHTML = board.map(boardCardHtml).join("") +
    (anyEstimated
      ? `<p class="board-note">ESPN publishes a win probability, shown as-is.
         Sleeper publishes none, so those are estimated: each starter's remaining
         projection is scaled by how much of their game is left, with per-position
         spreads fitted to Sleeper's own 2025 projections against what actually
         happened. The estimate never reaches 0% or 100% while games are still
         being played.</p>`
      : "") +
    (anyUpcoming
      ? `<p class="board-note">This week has not been played. Both platforms only
         report scoring for the week in progress, so future weeks show the fixture
         and the lineups rather than numbers that would be this week's in disguise.</p>`
      : "");
}

el("board").addEventListener("click", event => {
  const button = event.target.closest(".board-toggle");
  if (!button) return;
  const card = button.closest(".board-card");
  const league = card.getAttribute("data-league");
  if (expanded.has(league)) expanded.delete(league); else expanded.add(league);
  renderScoreboard();
});

/* ---- tabs -------------------------------------------------------------- */

let activeTab = "players";

function setTab(name) {
  activeTab = name;
  try { localStorage.setItem("tab", name); } catch (err) { /* private mode */ }

  el("tab-players").setAttribute("aria-selected", String(name === "players"));
  el("tab-scoreboard").setAttribute("aria-selected", String(name === "scoreboard"));

  const players = name === "players";
  el("list").hidden = !players;
  el("board").hidden = players;
  el("search").hidden = !players;
  el("reset").hidden = !players;
  el("changes").hidden = !players;
  // Only the week filter is meaningful on the scoreboard.
  document.querySelectorAll(".players-only").forEach(node => {
    node.hidden = !players;
  });

  render();
}

el("tab-players").addEventListener("click", () => setTab("players"));
el("tab-scoreboard").addEventListener("click", () => setTab("scoreboard"));

function render() {
  if (!BUNDLE) return;
  if (activeTab === "scoreboard") { renderScoreboard(); return; }

  const days = visibleDays();
  const showDayHeads = days.length > 1;

  let html = "";
  let shown = 0;
  const totals = { for: 0, against: 0, both: 0 };

  days.forEach(day => {
    const players = day.players.map(applyFilters).filter(Boolean);
    if (!players.length) return;

    // Split by kickoff wave first - a Sunday is three separate slates and one
    // list of 77 is unreadable - then within each wave your players come first
    // and opponents last.
    // Within each colour group, once games are under way, the biggest scores
    // rise to the top so the players making the most impact are seen first.
    // Unscored (pre-kickoff) players keep the fixed kickoff/position order.
    players.sort((a, b) =>
      a.wave - b.wave ||
      VERDICT_RANK[a.verdict] - VERDICT_RANK[b.verdict] ||
      ((b.points_max === null) - (a.points_max === null)) ||
      ((b.points_max || 0) - (a.points_max || 0)) ||
      a.kickoff_utc.localeCompare(b.kickoff_utc) ||
      (a.starting_anywhere === b.starting_anywhere ? 0 : a.starting_anywhere ? -1 : 1) ||
      a.name.localeCompare(b.name));

    if (showDayHeads) {
      html += `<div class="day-head">${esc(day.date_label)} · ${players.length}</div>`;
    }

    // A day with a single kickoff needs no wave heading; each card shows its
    // own time already.
    const multipleWaves = new Set(players.map(p => p.wave)).size > 1;

    let lastWave = null, lastVerdict = null;
    players.forEach(p => {
      if (multipleWaves && p.wave !== lastWave) {
        const inWave = players.filter(x => x.wave === p.wave);
        const times = [...new Set(inWave.map(x => x.kickoff_label))].join(" & ");
        html += `<div class="wave-head">${esc(p.wave_name)} ` +
                `<span>· ${esc(times)} · ${inWave.length}</span></div>`;
        lastWave = p.wave;
        lastVerdict = null;  // Verdict headings restart inside each wave.
      }
      if (p.verdict !== lastVerdict) {
        const scope = multipleWaves
          ? players.filter(x => x.wave === p.wave) : players;
        const count = scope.filter(x => x.verdict === p.verdict).length;
        html += `<div class="group-head ${p.verdict}">` +
                `${GROUP_LABEL[p.verdict]} · ${count}</div>`;
        lastVerdict = p.verdict;
      }
      html += viewMode === "condensed" ? rowHtml(p) : cardHtml(p);
      totals[p.verdict]++;
      shown++;
    });
  });

  el("chips").innerHTML =
    `<span class="chip for">${totals.for} for me</span>` +
    `<span class="chip against">${totals.against} against me</span>` +
    `<span class="chip both">${totals.both} conflict</span>` +
    `<span class="chip">${shown} shown</span>`;

  controls.forEach(id => {
    const select = el(id);
    const isDefault = select.value === "all" ||
      (id === "f-week" && select.value === String(BUNDLE.current.week)) ||
      (id === "f-day" && select.value === BUNDLE.current.date);
    select.classList.toggle("active", !isDefault);
  });

  const gameCount = days.reduce((n, d) => n + d.games.length, 0);
  el("subtitle").textContent =
    `Week ${el("f-week").value} · ${days.length} day${days.length === 1 ? "" : "s"}` +
    ` · ${gameCount} game${gameCount === 1 ? "" : "s"}`;

  el("list").innerHTML = shown ? html
    : `<div class="empty-state"><div class="big">🏈</div>
       <div>No players match these filters.</div></div>`;
}

/* ---- dropdown population ---------------------------------------------- */

function fillWeeks() {
  const weeks = Object.keys(BUNDLE.weeks || {}).sort((a, b) => a - b);
  el("f-week").innerHTML = weeks
    .map(w => `<option value="${esc(w)}">Week ${esc(w)}</option>`).join("");
  const current = String(BUNDLE.current.week);
  el("f-week").value = weeks.indexOf(current) !== -1 ? current : weeks[weeks.length - 1];
}

function fillDays(preferDate) {
  const days = weekReport().days || [];
  el("f-day").innerHTML =
    `<option value="all">All days</option>` +
    days.map(d => `<option value="${esc(d.date)}">${esc(d.short_label)}</option>`).join("");

  // Default to today when the chosen week contains it, otherwise the first day.
  const wanted = days.some(d => d.date === preferDate) ? preferDate
               : (days[0] ? days[0].date : "all");
  el("f-day").value = wanted;
}

function fillLeagues() {
  el("f-league").innerHTML =
    `<option value="all">All leagues</option>` +
    (BUNDLE.leagues || []).map(l =>
      `<option value="${esc(l.name)}">${esc(l.name)}</option>`).join("");
}

function resetFilters() {
  fillWeeks();
  fillDays(BUNDLE.current.date);
  ["f-league", "f-side", "f-slot", "f-injury"].forEach(id => { el(id).value = "all"; });
  el("search").value = "";
  render();
}

/* ---- boot -------------------------------------------------------------- */

/* Re-fetch while the page is open so scores move during games, keeping
   whatever filters are set rather than snapping back to the defaults. */
const REFRESH_MS = 120000;

async function refresh() {
  if (document.hidden || !BUNDLE) return;
  let bundle;
  try {
    const response = await fetch("api/report.json?t=" + Date.now());
    if (!response.ok) return;
    bundle = await response.json();
  } catch (err) {
    return;  // Offline or mid-deploy; the next tick will pick it up.
  }

  const keep = {};
  controls.forEach(id => { keep[id] = el(id).value; });

  BUNDLE = bundle;
  fillWeeks();
  fillDays(bundle.current.date);
  fillLeagues();

  // Restore each filter only if it still exists in the refreshed data.
  controls.forEach(id => {
    const select = el(id);
    if ([...select.options].some(o => o.value === keep[id])) {
      select.value = keep[id];
    }
  });

  el("footer").textContent = `Updated ${bundle.generated_label}`;
  render();
}

setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});

function paint(bundle) {
  BUNDLE = bundle;
  el("title").textContent = "Fantasy Tracker";

  fillWeeks();
  fillDays(bundle.current.date);
  fillLeagues();

  const changes = bundle.changes || [];
  el("changes").innerHTML = changes.length
    ? `<div class="changes"><h3>Lineup changes since the last check</h3>` +
      changes.map((c, i) => `<div class="${c.side === "mine" ? "mine" : ""}">` +
        `${esc((bundle.change_lines || [])[i] || "")}</div>`).join("") + `</div>`
    : "";

  el("errors").innerHTML = (bundle.errors || [])
    .map(e => `<div class="err">${esc(e)}</div>`).join("");

  el("footer").textContent = `Updated ${bundle.generated_label}`;

  let saved = "players";
  try { saved = localStorage.getItem("tab") || "players"; } catch (err) { /* ignore */ }
  setTab(saved === "scoreboard" ? "scoreboard" : "players");
}

el("f-week").addEventListener("change", () => {
  fillDays(BUNDLE.current.date);
  render();
});
["f-day", "f-league", "f-side", "f-slot", "f-injury"].forEach(id =>
  el(id).addEventListener("change", render));
el("search").addEventListener("input", render);
el("reset").addEventListener("click", resetFilters);

/* ---- push notification enrolment ---------------------------------------

   iOS only allows web push from a PWA that has been added to the Home Screen,
   and only over HTTPS. Both are checked before offering the button so the
   failure explains itself rather than throwing. */

const isStandalone = () =>
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);

function urlB64ToUint8Array(value) {
  const padding = "=".repeat((4 - (value.length % 4)) % 4);
  const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function notifStatus(text, kind) {
  const node = el("notif-status");
  node.textContent = text;
  node.className = kind || "";
}

async function initNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    notifStatus("This browser cannot receive web push notifications.", "bad");
    return;
  }
  if (!window.isSecureContext) {
    notifStatus("Open the published https:// address to set up notifications. " +
                "They cannot be enabled over a local network address.", "bad");
    return;
  }
  if (isIOS() && !isStandalone()) {
    notifStatus("First add this page to your Home Screen: tap the Share button, " +
                "then 'Add to Home Screen'. Reopen it from the icon and come back here.");
    return;
  }
  if (!window.VAPID_PUBLIC_KEY) {
    notifStatus("No push key is published with this app yet.", "bad");
    return;
  }

  let registration;
  try {
    registration = await navigator.serviceWorker.register("sw.js");
  } catch (err) {
    notifStatus("Could not start the notification worker: " + err.message, "bad");
    return;
  }

  const existing = await registration.pushManager.getSubscription();
  if (existing) {
    // Already registered: no instructions, no giant endpoint string. The code
    // stays one tap away in case this device ever needs re-registering.
    notifStatus("Notifications are on for this device.", "ok");
    el("notif-reveal").hidden = false;
    pendingSubscription = existing;
    return;
  }

  notifStatus("Turn on alerts for game-day mornings, kickoffs, and opponent " +
              "lineup changes.");
  el("notif-enable").hidden = false;
}

let pendingSubscription = null;

function showSubscription(subscription) {
  el("notif-result").hidden = false;
  el("notif-json").value = JSON.stringify(subscription);
}

el("notif-reveal").addEventListener("click", () => {
  if (!pendingSubscription) return;
  showSubscription(pendingSubscription);
  el("notif-reveal").hidden = true;
});

el("notif-enable").addEventListener("click", async () => {
  el("notif-enable").disabled = true;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      notifStatus("Notifications were not allowed. You can change this in " +
                  "Settings for this app.", "bad");
      el("notif-enable").disabled = false;
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(window.VAPID_PUBLIC_KEY),
    });
    notifStatus("Almost there - send the text below to your repository.", "ok");
    el("notif-enable").hidden = true;
    showSubscription(subscription);
  } catch (err) {
    notifStatus("Could not enable notifications: " + err.message, "bad");
    el("notif-enable").disabled = false;
  }
});

el("notif-copy").addEventListener("click", async () => {
  const field = el("notif-json");
  try {
    await navigator.clipboard.writeText(field.value);
    el("notif-copy").textContent = "Copied";
  } catch (err) {
    field.select();  // Clipboard API needs permission in some browsers.
    el("notif-copy").textContent = "Select all, then copy";
  }
  setTimeout(() => { el("notif-copy").textContent = "Copy to clipboard"; }, 2500);
});

initNotifications();

if (window.__REPORT__) {
  paint(window.__REPORT__);
} else {
  fetch("api/report.json?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(paint)
    .catch(err => {
      el("title").textContent = "No report yet";
      el("list").innerHTML =
        `<div class="empty-state"><div class="big">⚠️</div>
         <div>Could not load the report.<br><small>${esc(err.message)}</small></div></div>`;
    });
}
</script>
</body>
</html>
